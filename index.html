<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Essential English Vocabulary</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:wght@500;700&family=Hind+Siliguri:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eaf0f6; --card:#ffffff; --ink:#14213d; --muted:#5b6b85;
  --line:#d3dce8; --accent:#f2a900; --accent-ink:#14213d; --err:#b3261e;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1830; --card:#18233f; --ink:#eef2f8; --muted:#9db0cc; --line:#2b3a5c; --err:#ff8a80; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri",system-ui,sans-serif;line-height:1.6}
h1,h2,.word{font-family:"Literata",Georgia,serif}
.hidden{display:none!important}

/* Login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px}
.box h1{margin:0 0 4px;font-size:1.6rem}
.box p{margin:0 0 20px;color:var(--muted)}
label{display:block;font-weight:600;margin:12px 0 4px}
input{width:100%;padding:10px 12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
input:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:8px;padding:10px 16px}
.primary{width:100%;margin-top:18px;background:var(--accent);color:var(--accent-ink)}
#error{color:var(--err);min-height:1.5em;margin:10px 0 0}

/* Vocabulary */
header{max-width:760px;margin:0 auto;padding:28px 20px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
header h1{margin:0;font-size:1.9rem}
header p{margin:4px 0 0;color:var(--muted)}
.logout{background:transparent;color:var(--ink);border:1px solid var(--line)}
.tools{max-width:760px;margin:0 auto;padding:8px 20px;display:flex;gap:10px;flex-wrap:wrap}
.tools input{flex:1;min-width:200px}
.tools .toggle{background:var(--card);color:var(--ink);border:1px solid var(--line)}
main{max-width:760px;margin:0 auto;padding:8px 20px 40px}
.entry{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:14px 18px;margin:12px 0}
.word{font-size:1.35rem;font-weight:700}
.pos{color:var(--muted);font-style:italic;margin-left:8px;font-size:.95rem}
.def{margin:2px 0}
.bn{font-weight:500}
.ex{color:var(--muted);margin:4px 0 0}
.meanings-off .def,.meanings-off .bn{filter:blur(6px);cursor:pointer;user-select:none}
.meanings-off .entry.reveal .def,.meanings-off .entry.reveal .bn{filter:none}
#count{max-width:760px;margin:0 auto;padding:0 20px;color:var(--muted)}
</style>
</head>
<body>

<section id="login">
  <div class="box">
    <h1>Vocabulary</h1>
    <p>Sign in to see the word list.</p>
    <label for="uid">ID</label>
    <input id="uid" autocomplete="username">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <p id="error" role="alert"></p>
    <button class="primary" id="loginBtn">Sign in</button>
  </div>
</section>

<section id="app" class="hidden">
  <header>
    <div>
      <h1>Essential English Vocabulary</h1>
      <p>20 words every learner should know</p>
    </div>
    <button class="logout" id="logoutBtn">Sign out</button>
  </header>
  <div class="tools">
    <input id="search" type="search" placeholder="Search a word or Bengali meaning" aria-label="Search words">
    <button class="toggle" id="toggleBtn">Hide meanings</button>
  </div>
  <p id="count"></p>
  <main id="list"></main>
</section>

<script>
/* ===== Change login here =====
   The hash below is for ID "student" and password "vocab123".
   See the instructions to make your own hash. */
const LOGIN_HASH = "71bb023a87d04168df88ed79d2a6ecb2f884172b165268f9a2457fcadef01124";

const WORDS = [
  ["abandon","verb","to leave completely","ত্যাগ করা","He abandoned his plan."],
  ["accurate","adjective","correct and exact","নির্ভুল","The report is accurate."],
  ["achieve","verb","to succeed in reaching a goal","অর্জন করা","She achieved her dream."],
  ["benefit","noun","a helpful or good result","সুবিধা, উপকার","Exercise has many benefits."],
  ["challenge","noun","a difficult task that tests you","চ্যালেঞ্জ, প্রতিবন্ধকতা","Learning English is a challenge."],
  ["consider","verb","to think about carefully","বিবেচনা করা","Please consider my request."],
  ["decrease","verb","to become smaller or less","হ্রাস পাওয়া","Prices decreased last month."],
  ["efficient","adjective","working well without waste","দক্ষ","This is an efficient method."],
  ["essential","adjective","absolutely necessary","অপরিহার্য","Water is essential for life."],
  ["generate","verb","to produce or create","উৎপাদন করা","Solar panels generate power."],
  ["identify","verb","to recognize and name","শনাক্ত করা","Can you identify the problem?"],
  ["improve","verb","to make or become better","উন্নতি করা","I want to improve my speaking."],
  ["maintain","verb","to keep in good condition","বজায় রাখা","Maintain a healthy routine."],
  ["obtain","verb","to get or receive","লাভ করা, সংগ্রহ করা","He obtained a visa."],
  ["potential","noun","possible ability to develop","সম্ভাবনা","The child has great potential."],
  ["require","verb","to need or demand","প্রয়োজন হওয়া","This job requires experience."],
  ["significant","adjective","important or large enough to matter","উল্লেখযোগ্য","There was a significant change."],
  ["support","verb","to help or give strength","সমর্থন করা","Families support each other."],
  ["traditional","adjective","following old customs","ঐতিহ্যবাহী","We ate a traditional meal."],
  ["vulnerable","adjective","easily hurt or harmed","ঝুঁকিপূর্ণ, অরক্ষিত","Children are vulnerable in floods."]
];

const $ = id => document.getElementById(id);

async function sha256(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
}

function show(loggedIn){
  $("login").classList.toggle("hidden", loggedIn);
  $("app").classList.toggle("hidden", !loggedIn);
  if(loggedIn) render();
}

async function login(){
  const id = $("uid").value.trim();
  const pw = $("pw").value;
  const hash = await sha256(id + ":" + pw);
  if(hash === LOGIN_HASH){
    try{ sessionStorage.setItem("vocab_ok","1"); }catch(e){}
    $("error").textContent = "";
    $("pw").value = "";
    show(true);
  }else{
    $("error").textContent = "Wrong ID or password. Try again.";
  }
}

function render(){
  const q = $("search").value.trim().toLowerCase();
  const items = WORDS.filter(w => w.join(" ").toLowerCase().includes(q));
  $("count").textContent = items.length + " of " + WORDS.length + " words";
  $("list").innerHTML = items.length ? items.map(w => `
    <article class="entry">
      <div><span class="word">${w[0]}</span><span class="pos">${w[1]}</span></div>
      <p class="def">${w[2]}</p>
      <p class="bn">${w[3]}</p>
      <p class="ex">“${w[4]}”</p>
    </article>`).join("") : "<p>No word found.</p>";
}

$("loginBtn").addEventListener("click", login);
$("pw").addEventListener("keydown", e => { if(e.key === "Enter") login(); });
$("uid").addEventListener("keydown", e => { if(e.key === "Enter") $("pw").focus(); });
$("logoutBtn").addEventListener("click", () => {
  try{ sessionStorage.removeItem("vocab_ok"); }catch(e){}
  show(false);
});
$("search").addEventListener("input", render);
$("toggleBtn").addEventListener("click", () => {
  const off = $("list").classList.toggle("meanings-off");
  $("toggleBtn").textContent = off ? "Show meanings" : "Hide meanings";
});
$("list").addEventListener("click", e => {
  const entry = e.target.closest(".entry");
  if(entry) entry.classList.toggle("reveal");
});

let ok = false;
try{ ok = sessionStorage.getItem("vocab_ok") === "1"; }catch(e){}
show(ok);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn With Naznin</title>
<style>
:root{--bg:#f6f4ff;--card:#fff;--tx:#1f1b2e;--mu:#6b6785;--ac:#6c4ff0;--bd:#e3dffa;--tip:#fff7df}
@media (prefers-color-scheme:dark){:root{--bg:#14121f;--card:#1e1b2e;--tx:#ece9fb;--mu:#a29fbd;--ac:#9a84ff;--bd:#322e4d;--tip:#2e2916}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--tx);line-height:1.55}
header{text-align:center;padding:22px 12px 8px}
h1{margin:0;font-size:clamp(26px,6vw,38px);color:var(--ac)}
header p{margin:4px 0 0;color:var(--mu)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;max-width:860px;margin:auto}
.bar input{flex:1 1 220px;padding:11px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font-size:16px}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 14px;border-radius:12px;font-size:15px}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:860px;margin:auto;padding:6px 12px 40px}
.count{color:var(--mu);font-size:14px;margin:4px 2px 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.w{font-size:24px;font-weight:700;color:var(--ac)}
.pr{color:var(--mu);font-style:italic}.pos{font-size:13px;color:var(--mu)}
.star{font-size:26px;line-height:1;padding:6px 10px;color:var(--mu)}
.star.f{color:#f5a623;border-color:#f5a623}
.lb{font-weight:700;margin-top:8px;font-size:14px;color:var(--ac)}
.tip{background:var(--tip);border-radius:10px;padding:8px 12px;margin-top:10px}
.hide .bn{display:none}
.num{font-size:12px;color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:30px}
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:20}
#login form{background:var(--card);border:1px solid var(--bd);padding:26px;border-radius:18px;width:min(340px,92vw);display:grid;gap:10px;text-align:center}
#login input{padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
#err{color:#d33;font-size:14px;min-height:18px}
</style>
</head>
<body>
<div id="login"><form id="lf">
<h2 style="margin:0;color:var(--ac)">Learn With Naznin</h2>
<input id="uid" placeholder="ID" autocomplete="username">
<input id="pw" type="password" placeholder="Password" autocomplete="current-password">
<button class="on" type="submit">প্রবেশ করুন</button><div id="err"></div></form></div>

<div id="app" style="display:none">
<header><h1>Learn With Naznin</h1><p>English Word Meaning Learning</p></header>
<div class="bar">
<input id="q" type="search" placeholder="🔍 শব্দ বা অর্থ খুঁজুন...">
<button id="hb">বাংলা Hide</button>
<button id="fb">⭐ Favourite</button>
<button id="lo">Logout</button>
</div>
<main><div class="count" id="ct"></div><div id="list"></div></main>
</div>

const $=s=>document.querySelector(s);
let favs=[];try{favs=JSON.parse(localStorage.getItem("naznin_favs")||"[]")}catch(e){}
let hideBn=false,onlyFav=false;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function saveFavs(){try{localStorage.setItem("naznin_favs",JSON.stringify(favs))}catch(e){}}
function render(){
 const q=$("#q").value.trim().toLowerCase();
 const rows=DATA.filter(d=>(!onlyFav||favs.includes(d.n))&&(!q||JSON.stringify(d).toLowerCase().includes(q)));
 $("#ct").textContent=rows.length+" টি শব্দ";
 $("#list").innerHTML=rows.length?rows.map(d=>`<div class="card">
 <div class="top"><div><div class="num">Word No: ${d.n}</div><span class="w">${esc(d.w)}</span> <span class="pr bn">[${esc(d.p)}]</span><div class="pos">${esc(d.pos)}</div></div>
 <button class="star ${favs.includes(d.n)?"f":""}" data-n="${d.n}" aria-label="favourite">${favs.includes(d.n)?"★":"☆"}</button></div>
 <div class="lb">English Meaning</div><div>${esc(d.en)}</div>
 <div class="lb bn">বাংলা অর্থ</div><div class="bn">${esc(d.bn)}</div>
 ${d.syn?`<div class="lb">Synonyms</div><div>${hideBn?esc(d.syn.replace(/\s*\([^)]*\)/g,"")):esc(d.syn)}</div>`:""}
 ${d.ant?`<div class="lb">Antonyms</div><div>${hideBn?esc(d.ant.replace(/\s*\([^)]*\)/g,"")):esc(d.ant)}</div>`:""}
 <div class="lb">Example</div>${d.ex.map((e,i)=>`<div><i>${i+1}. ${esc(e)}</i></div>`).join("")}
 <div class="tip bn">💡 <b>মনে রাখার কৌশল:</b> ${esc(d.tip)}</div></div>`).join(""):'<div class="empty">কোনো শব্দ পাওয়া যায়নি</div>';
}
$("#q").oninput=render;
$("#hb").onclick=()=>{hideBn=!hideBn;document.body.classList.toggle("hide",hideBn);$("#hb").classList.toggle("on",hideBn);$("#hb").textContent=hideBn?"বাংলা Show":"বাংলা Hide";render()};
$("#fb").onclick=()=>{onlyFav=!onlyFav;$("#fb").classList.toggle("on",onlyFav);render()};
$("#list").onclick=e=>{const b=e.target.closest(".star");if(!b)return;const n=+b.dataset.n;favs=favs.includes(n)?favs.filter(x=>x!==n):[...favs,n];saveFavs();render()};
function sha256(ascii){var rr=function(v,a){return(v>>>a)|(v<<(32-a))},mp=Math.pow,mw=mp(2,32),res="",words=[],bl=ascii.length*8,hash=[],k=[],pc=0,comp={},i,j;
for(var c=2;pc<64;c++){if(!comp[c]){for(i=0;i<313;i+=c)comp[i]=c;hash[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0}}
ascii+="\x80";while(ascii.length%64-56)ascii+="\x00";
for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);words[i>>2]|=j<<((3-i)%4)*8}
words[words.length]=((bl/mw)|0);words[words.length]=bl;
for(j=0;j<words.length;){var w=words.slice(j,j+=16),old=hash;hash=hash.slice(0,8);
for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10))|0));
var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}
for(i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0}
for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;res+=((b<16)?0:"")+b.toString(16)}return res}
function sha(s){return Promise.resolve(sha256(unescape(encodeURIComponent(s))))}
function enter(){$("#login").style.display="none";$("#app").style.display="block";render()}
$("#lf").onsubmit=async e=>{e.preventDefault();try{
 if($("#uid").value.trim()===USER_ID&&await sha($("#pw").value)===PASS_HASH){try{sessionStorage.setItem("naznin_in","1")}catch(x){}enter()}
 else $("#err").textContent="ID বা Password ভুল হয়েছে"}catch(x){$("#err").textContent="সমস্যা: "+x.message}};
$("#lo").onclick=()=>{try{sessionStorage.removeItem("naznin_in")}catch(x){}location.reload()};
try{if(sessionStorage.getItem("naznin_in")==="1")enter()}catch(e){}
</script>
